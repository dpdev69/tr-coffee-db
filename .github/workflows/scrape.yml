name: Scrape Coffee Data

on:
  schedule:
    # Every 2 days at 3:00 AM UTC
    - cron: '0 3 */2 * *'
  workflow_dispatch:
    inputs:
      roasters:
        description: 'Specific roaster slugs (space-separated, leave empty for all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: scrapers/package-lock.json

      - name: Install scraper dependencies
        working-directory: scrapers
        run: npm ci

      - name: Validate required secrets
        run: |
          missing=0

          if [ -z "$SUPABASE_URL" ]; then
            echo "::error title=Missing repository secret::SUPABASE_URL is required for scheduled scrapes."
            missing=1
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error title=Missing repository secret::SUPABASE_SERVICE_ROLE_KEY is required for scheduled scrapes."
            missing=1
          fi

          exit "$missing"

      - name: Run scrapers
        working-directory: scrapers
        env:
          ROASTERS: ${{ github.event.inputs.roasters || '' }}
        run: npx tsx src/index.ts "$ROASTERS"
