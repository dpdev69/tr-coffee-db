name: Scrape Coffee Data

on:
  schedule:
    # Every 2 days at 3:00 AM UTC
    - cron: '0 3 */2 * *'
  workflow_dispatch:
    inputs:
      roasters:
        description: 'Specific roaster slugs (space-separated, leave empty for all)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: scrapers/package-lock.json

      - name: Install scraper dependencies
        working-directory: scrapers
        run: npm ci

      - name: Run scrapers
        working-directory: scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx src/index.ts ${{ github.event.inputs.roasters }}
