name: Refresh D1 Coffee Catalog

on:
  schedule:
    # Daily at 03:00 Istanbul. GitHub may delay scheduled starts.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      roasters:
        description: 'Space-separated roaster slugs; empty attempts every active source'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: d1-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: '4c1a4493b8584296f35c3eddc8279112'
      # Repository variable CLOUDFLARE_D1_DATABASE_ID selects the database; unset keeps staging (docs/launch-day.md switches it).
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID || '5090f52d-546e-4ba6-bdcd-b4ee531a29a3' }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      # Shops that refuse GitHub's network are fetched through our own Worker; see docs/crawl-relay.md.
      # Repository variable CRAWL_RELAY_URL points at the crawler Worker that matches the database; unset keeps staging.
      CRAWL_RELAY_URL: ${{ vars.CRAWL_RELAY_URL || 'https://coffeedb-v2-crawler-staging.hellobasalt.workers.dev/relay' }}
      CRAWL_RELAY_TOKEN: ${{ secrets.CRAWL_RELAY_TOKEN }}
      # Bot Fight Mode on the site's zone answers GitHub's runners 403, so the purge and warm-up go through the crawler Worker's
      # /site route (same token as the relay), which hands them to the web Worker over a service binding (docs/crawl-relay.md).
      SITE_VIA: ${{ vars.SITE_VIA || 'https://coffeedb-v2-crawler-staging.hellobasalt.workers.dev/site' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scrapers/package-lock.json
      - name: Install crawler dependencies
        run: npm ci --prefix scrapers
      - name: Refresh all active roasters
        id: refresh
        env:
          ROASTERS: ${{ inputs.roasters }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_D1_API_TOKEN" || { echo '::error::CLOUDFLARE_D1_API_TOKEN is missing'; exit 1; }
          read -ra slugs <<< "$ROASTERS"
          scrapers/node_modules/.bin/tsx scripts/v2-refresh.mts "${slugs[@]}"
      - name: Keep the refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-refresh-${{ github.run_id }}
          path: .local/v2/refresh/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      # Reviewed corrections and size-twin links; runs even when a source needs attention.
      - name: Apply manual corrections
        id: corrections
        if: ${{ !cancelled() }}
        run: scrapers/node_modules/.bin/tsx scripts/v2-apply-corrections.mts
      # Pages and JSON are kept at the edge for 6 hours (shared/v2/read-cache.ts); dropping them now shows tonight's
      # catalog at once. Needs the Worker secret and the repository secret CACHE_PURGE_TOKEN (same value), vars.SITE_URL and
      # the relay token; the request goes through SITE_VIA.
      # Only after a step that wrote tonight's data: when the database refuses reads (daily allowance spent), both fail,
      # and purging then would replace every good edge copy with outage notices until the next day.
      - name: Purge the edge cache
        id: purge
        if: ${{ !cancelled() && (steps.refresh.outcome == 'success' || steps.corrections.outcome == 'success') }}
        env:
          CACHE_PURGE_TOKEN: ${{ secrets.CACHE_PURGE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CACHE_PURGE_TOKEN" ] || [ -z "$SITE_URL" ] || [ -z "$CRAWL_RELAY_TOKEN" ]; then echo '::notice::Edge purge not configured; pages refresh within 6 hours.'; exit 0; fi
          curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $CRAWL_RELAY_TOKEN" -H "X-Cache-Purge-Token: $CACHE_PURGE_TOKEN" "${SITE_VIA%/}/api/cache"
      # Right after the purge, one request at a time: the catalog-wide results (landing facts, sitemap, similarity and quiz
      # candidates) are computed once here instead of by the first visitors together, and the commonest pages are stored at
      # the edge. It also lists the stored results and their sizes, and flags one that was not stored (docs/read-budget.md).
      - name: Warm the edge cache
        if: ${{ !cancelled() && steps.purge.outcome == 'success' }}
        continue-on-error: true
        env:
          CACHE_PURGE_TOKEN: ${{ secrets.CACHE_PURGE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CACHE_PURGE_TOKEN" ] || [ -z "$SITE_URL" ]; then echo '::notice::Edge purge not configured; nothing to warm.'; exit 0; fi
          scrapers/node_modules/.bin/tsx scripts/warm-cache.mts
