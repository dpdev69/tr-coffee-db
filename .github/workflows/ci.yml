name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 001-kahvedrop-v2

permissions:
  contents: read

jobs:
  database:
    name: Database CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: coffee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: coffee_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bootstrap Supabase roles and extension schema
        run: psql --set ON_ERROR_STOP=1 --file tests/sql/bootstrap.sql

      - name: Apply all database migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done

      - name: Verify scraper writes synchronize coffee journeys
        run: psql --set ON_ERROR_STOP=1 --file tests/sql/coffee-journey-trigger.sql

  web:
    name: Web CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install web dependencies
        run: npm ci

      - name: Install shared crawler dependencies
        run: npm --prefix scrapers ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Build Cloudflare web Worker
        run: npm run build:cloudflare

      - name: Validate crawler Worker bundle
        run: npm run build:crawler

  scrapers:
    name: Scraper CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scrapers/package-lock.json

      - name: Install scraper dependencies
        run: npm --prefix scrapers ci

      - name: Typecheck scrapers
        run: npm --prefix scrapers run typecheck

  tests:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scrapers/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install scraper dependencies
        run: npm --prefix scrapers ci

      - name: Run tests
        run: npm test
